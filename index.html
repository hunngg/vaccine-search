    MIIFH:   "衛部菌疫輸字第001105號",   // Hexaxim
    MIHPVH:  "衛部菌疫輸字第001001號",   // Gardasil 9
    MIHBVG:  "衛署菌疫輸字第000301號",   // Engerix-B
    MIHAV:   "衛署菌疫輸字第000456號",   // Havrix 720 Junior
    MIHAVH:  "衛署菌疫輸字第000456號",   // Havrix 1440
    MIJECV3: "衛部菌疫輸字第000967號",   // Imojev
    MIPLV:   "衛部菌疫輸字第001010號",   // Synagis
    MIVAXM:  "衛部菌疫輸字第001277號",   // Fluarix 三價
    MSVAX:   "衛部菌疫輸字第001286號",   // FluMist
    MIIEV:   "衛部菌疫製字第000152號",   // Envacgen
    MIRSV:   "衛部菌疫輸字第001251號",   // Arexvy
    MIRSV1:  "衛部菌疫輸字第001267號",   // Abrysvo
    MINIRC:  "衛部菌疫輸字第001266號",   // Beyfortus 50mg
    MINIRH:  "衛部菌疫輸字第001266號",   // Beyfortus 100mg
  };
  const FDA_HOME = "https://mcp.fda.gov.tw/";
  const leafletUrl = code => PERMIT_BY_CODE[code] ? "https://mcp.fda.gov.tw/im_detail_1/" + encodeURIComponent(PERMIT_BY_CODE[code]) : null;

  // 院內處方集用法用量（由藥劑部提供）。lv＝縮排層級
  const FORMULARY_BY_CODE = {
    MIPLV: [{ t: "IM, 15 mg/kg monthly for up to 6 doses.", lv: 0 }],
    MIZOSC: [
      { t: "Adults ≥50 years of age (immunocompetent):", lv: 0, b: true },
      { t: "0.5 mL administered as a 2-dose series at 0 and 2 to 6 months.", lv: 1 },
      { t: "Adults ≥18 years of age (immunocompromised):", lv: 0, b: true },
      { t: "0.5 mL administered as a 2-dose series at 0 and 1 to 2 months.", lv: 1 },
    ],
  };
  FORMULARY_BY_CODE.MINIRC = FORMULARY_BY_CODE.MINIRH = [
    { t: "Neonates and infants (<1 yr):", lv: 0, b: true },
    { t: "<5 kg: 50 mg as a single dose.", lv: 1 },
    { t: "≥5 kg: 100 mg as a single dose.", lv: 1 },
    { t: "Patients who undergo cardiopulmonary bypass after dose: administer an additional dose as soon as patient is stable after surgery:", lv: 1 },
    { t: "≤90 days since initial dose: the additional dose based on body weight.", lv: 2 },
    { t: ">90 days since initial dose: the additional dose should be 50 mg regardless of body weight.", lv: 2 },
    { t: "Children (1–<2 yrs):", lv: 0, b: true },
    { t: "200 mg (2 × 100 mg injections).", lv: 1 },
    { t: "Patients who undergo cardiopulmonary bypass after dose: administer an additional dose as soon as patient is stable after surgery:", lv: 1 },
    { t: "≤90 days since initial dose: the additional dose should be 200 mg regardless of body weight.", lv: 2 },
    { t: ">90 days since initial dose: the additional dose should be 100 mg regardless of body weight.", lv: 2 },
  ];

  const TYPE_STYLE = {
    live:    { bg: "#fbe9e1", fg: "#a0452a", border: "#efc0ad" },
    nonlive: { bg: "#e4eef6", fg: "#2f5e84", border: "#b9d0e3" },
    mab:     { bg: "#efe7f5", fg: "#6a4a88", border: "#d4c3e3" },
  };
  function TypeBadge({ code }) {
    const info = infoOf(code);
    if (!info) return null;
    const s = TYPE_STYLE[info.group];
    return (
      <span style={{ marginLeft: "6px", fontSize: "11px", padding: "1px 8px", borderRadius: "10px", background: s.bg, color: s.fg, border: `1px solid ${s.border}`, verticalAlign: "middle", whiteSpace: "nowrap" }}>
        {info.badge}
      </span>
    );
  }

  function InfoModal({ v, onClose }) {
    const info = infoOf(v.code);
    React.useEffect(() => {
      const onKey = e => { if (e.key === "Escape") onClose(); };
      document.addEventListener("keydown", onKey);
      const prev = document.body.style.overflow;
      document.body.style.overflow = "hidden";
      return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = prev; };
    }, []);
    if (!info) return null;
    const s = TYPE_STYLE[info.group];
    const secTitle = (color) => ({ fontSize: "14px", fontWeight: "700", color: color || "var(--green)", marginBottom: "4px" });
    const list = { margin: 0, paddingLeft: "20px", fontSize: "14px", lineHeight: "1.75", color: "var(--text)" };
    const Sec = ({ title, items, color }) => (items && items.length) ? (
      <div style={{ marginTop: "16px" }}>
        <div style={secTitle(color)}>{title}</div>
        <ul style={list}>{items.map((t, i) => <li key={i}>{t}</li>)}</ul>
      </div>
    ) : null;

    return (
      <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(40,35,28,0.45)", zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center", padding: "12px" }}>
        <div role="dialog" aria-modal="true" onClick={e => e.stopPropagation()} style={{ width: "100%", maxWidth: "640px", maxHeight: "88vh", overflowY: "auto", background: "var(--surface)", borderRadius: "16px", boxShadow: "0 10px 40px rgba(0,0,0,0.25)" }}>
          <div style={{ position: "sticky", top: 0, background: "var(--green)", color: "#fff", padding: "14px 16px", display: "flex", gap: "10px", alignItems: "flex-start", zIndex: 1 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: "12px", opacity: 0.85 }}>接種建議與注意事項</div>
              <div style={{ fontSize: "17px", fontWeight: "700", lineHeight: "1.4" }}>{v.chinese}</div>
              <div style={{ fontSize: "12px", opacity: 0.85 }}>{v.brand}</div>
            </div>
            <button onClick={onClose} aria-label="關閉" style={{ border: "none", background: "rgba(255,255,255,0.18)", color: "#fff", width: "34px", height: "34px", borderRadius: "17px", fontSize: "18px", cursor: "pointer", flexShrink: 0 }}>✕</button>
          </div>

          <div style={{ padding: "4px 18px 18px" }}>
            <div style={{ marginTop: "14px", display: "flex", alignItems: "center", gap: "8px", flexWrap: "wrap" }}>
              <span style={{ fontSize: "13px", fontWeight: "700", color: "var(--text2)" }}>類型</span>
              <span style={{ fontSize: "13px", padding: "2px 10px", borderRadius: "10px", background: s.bg, color: s.fg, border: `1px solid ${s.border}`, fontWeight: "600" }}>{info.type}</span>
            </div>
            {info.pageNote && (
              <div style={{ marginTop: "10px", ...warnBox, fontSize: "12.5px" }}>ℹ️ {info.pageNote}</div>
            )}
            <Sec title="說明" items={info.about} />
            <Sec title={info.recTitle || "自費接種建議"} items={info.recommend} />
            {FORMULARY_BY_CODE[v.code] && (
              <div style={{ marginTop: "16px" }}>
                <div style={secTitle()}>用法用量（院內處方集）</div>
                <div style={{ fontSize: "13.5px", lineHeight: "1.7", color: "var(--text)", background: "var(--surface2)", border: "1px solid var(--border)", borderRadius: "10px", padding: "10px 12px" }}>
                  {FORMULARY_BY_CODE[v.code].map((l, i) => (
                    <div key={i} style={{ paddingLeft: `${l.lv * 16}px`, fontWeight: l.b ? "700" : "400" }}>{l.lv > 0 ? "• " : ""}{l.t}</div>
                  ))}
                </div>
              </div>
            )}
            <Sec title="接種禁忌" items={info.contra} color="#b03a2e" />
            <Sec title="注意事項" items={info.caution} color="var(--amber)" />
            {info.extra && <Sec title={info.extra.title} items={info.extra.items} color="var(--amber)" />}
            {info.reactions && info.reactions.length > 0 && (
              <details style={{ marginTop: "16px" }}>
                <summary style={{ ...secTitle(), cursor: "pointer" }}>接種後可能發生的反應</summary>
                <ul style={{ ...list, marginTop: "4px" }}>{info.reactions.map((t, i) => <li key={i}>{t}</li>)}</ul>
              </details>
            )}

            <div style={{ marginTop: "18px", paddingTop: "12px", borderTop: "1px dashed var(--border2)", fontSize: "12px", color: "var(--text3)", lineHeight: "1.7" }}>
              {info.sourceText || `資料來源：疾病管制署「${info.title}」頁面（最後更新 ${info.updated}）。本視窗為重點整理，完整內容與最新版本請見原文。`}
              <div style={{ marginTop: "8px", display: "flex", gap: "8px", flexWrap: "wrap" }}>
                <a href={info.url} target="_blank" rel="noopener noreferrer" style={{ display: "inline-block", padding: "7px 14px", borderRadius: "16px", border: "1.5px solid var(--green)", color: "var(--green)", textDecoration: "none", fontWeight: "600", fontSize: "13px" }}>
                  {info.linkLabel || "開啟疾管署原文 ↗"}
                </a>
                {!info.sourceText && leafletUrl(v.code) && (
                  <a href={leafletUrl(v.code)} target="_blank" rel="noopener noreferrer" style={{ display: "inline-block", padding: "7px 14px", borderRadius: "16px", border: "1.5px solid var(--border2)", color: "var(--text2)", textDecoration: "none", fontWeight: "600", fontSize: "13px" }}>
                    開啟仿單（食藥署）↗
                  </a>
                )}
              </div>
            </div>
            <div style={{ marginTop: "12px", ...warnBox, fontSize: "12px" }}>⚠️ 供醫療人員參考，<strong>實際接種以醫師評估為準</strong>。</div>
          </div>
        </div>
      </div>
    );
  }

  const categories = ["全部","嬰幼兒","成人","肺炎","肝炎","RSV","腸病毒","流感"];

  function hl(text, q) {
    if (!q) return text;
    const i = text.toLowerCase().indexOf(q.toLowerCase());
    if (i === -1) return text;
    return <>{text.slice(0,i)}<mark>{text.slice(i,i+q.length)}</mark>{text.slice(i+q.length)}</>;
  }

  /* ── Header ── */
  function Header({ tab }) {
    const isPneu = tab === "pneu";
    return (
      <div style={{
        background: "var(--green)",
        padding: "28px 24px 22px",
        textAlign: "center",
        position: "relative",
        overflow: "hidden",
      }}>
        {/* decorative leaf circles */}
        <div style={{ position:"absolute", top:-30, right:-30, width:120, height:120, borderRadius:"50%", background:"rgba(255,255,255,0.07)" }} />
        <div style={{ position:"absolute", bottom:-20, left:-20, width:80, height:80, borderRadius:"50%", background:"rgba(255,255,255,0.05)" }} />
        <div style={{ fontSize:"11px", letterSpacing:"4px", color:"var(--green-md)", marginBottom:"6px", textTransform:"uppercase", position:"relative" }}>
          {isPneu ? "肺炎鏈球菌疫苗 · 公費／自費" : "自費疫苗 · 2026.10.05 更新"}
        </div>
        <h1 style={{ margin:0, fontSize:"22px", lineHeight:"1.4", fontWeight:"700", color:"#fff", letterSpacing:"1px", position:"relative" }}>
          💉 院內自費疫苗查詢與接種建議
        </h1>
        <p style={{ marginTop:"6px", fontSize:"13px", color:"rgba(255,255,255,0.65)", position:"relative" }}>
          {isPneu ? "依年齡、身分與接種史，查詢肺炎鏈球菌疫苗建議" : "輸入關鍵字搜尋疫苗名稱、商品名或疾病類型"}
        </p>
      </div>
    );
  }

  /* ── Tab Bar ── */
  function TabBar({ active, onChange }) {
    const tabs = [
      { id:"search", label:"🔍 關鍵字查詢" },
      { id:"table",  label:"📋 完整價目表" },
      { id:"pneu",   label:"🫁 肺炎鏈球菌" },
    ];
    return (
      <div style={{ display:"flex", background:"var(--surface)", borderBottom:"2px solid var(--border)" }}>
        {tabs.map(t => (
          <button key={t.id} onClick={() => onChange(t.id)} style={{
            flex:1, padding:"13px 2px", border:"none",
            borderBottom: active===t.id ? "3px solid var(--green)" : "3px solid transparent",
            background:"transparent",
            color: active===t.id ? "var(--green)" : "var(--text3)",
            fontSize:"13px", fontWeight: active===t.id ? "700" : "400",
            cursor:"pointer", transition:"all 0.2s",
          }}>
            {t.label}
          </button>
        ))}
      </div>
    );
  }

  /* ── Search Tab ── */
  function SearchTab() {
    const [query,    setQuery]    = useState("");
    const [category, setCategory] = useState("全部");
    const [selected, setSelected] = useState(null);
    const [infoFor,  setInfoFor]  = useState(null);

    const results = useMemo(() => {
      const q = query.trim().toLowerCase();
      return vaccines.filter(v => {
        const mc = category==="全部" || v.tags.includes(category);
        const mq = !q ||
          v.chinese.toLowerCase().includes(q) ||
          v.brand.toLowerCase().includes(q) ||
          v.generic.toLowerCase().includes(q) ||
          v.code.toLowerCase().includes(q) ||
          v.tags.some(t => t.toLowerCase().includes(q)) ||
          (infoOf(v.code) && (infoOf(v.code).type.includes(q) || infoOf(v.code).badge.includes(q)));
        return mc && mq;
      });
    }, [query, category]);

    return (
      <div style={{ padding:"20px 16px", maxWidth:"680px", margin:"0 auto" }}>

        {/* Search input */}
        <div style={{ position:"relative", marginBottom:"14px" }}>
          <span style={{ position:"absolute", left:"14px", top:"50%", transform:"translateY(-50%)", fontSize:"17px", opacity:0.45 }}>🔍</span>
          <input type="text"
            placeholder="搜尋：如「肺炎」、「HPV」、「流感」、「腸病毒」…"
            value={query}
            onChange={e => { setQuery(e.target.value); setSelected(null); }}
            style={{
              width:"100%", padding:"13px 16px 13px 44px",
              borderRadius:"12px",
              border:"1.5px solid var(--border)",
              background:"var(--surface)",
              color:"var(--text)", fontSize:"15px", outline:"none",
              boxShadow:"0 1px 4px rgba(90,138,106,0.08)",
              transition:"border 0.2s, box-shadow 0.2s",
            }}
            onFocus={e=>{ e.target.style.borderColor="var(--green)"; e.target.style.boxShadow="0 0 0 3px rgba(90,138,106,0.12)"; }}
            onBlur={e=>{ e.target.style.borderColor="var(--border)"; e.target.style.boxShadow="0 1px 4px rgba(90,138,106,0.08)"; }}
          />
        </div>

        {/* Category chips */}
        <div style={{ display:"flex", gap:"8px", flexWrap:"wrap", marginBottom:"18px" }}>
          {categories.map(cat => (
            <button key={cat} onClick={() => { setCategory(cat); setSelected(null); }} style={{
              padding:"5px 14px", borderRadius:"20px",
              border: category===cat ? "1.5px solid var(--green)" : "1.5px solid var(--border)",
              background: category===cat ? "var(--green)" : "var(--surface)",
              color: category===cat ? "#fff" : "var(--text2)",
              fontSize:"13px", cursor:"pointer",
              fontWeight: category===cat ? "600" : "400",
              transition:"all 0.15s",
              boxShadow: category===cat ? "0 2px 6px rgba(90,138,106,0.25)" : "none",
            }}>
              {cat}
            </button>
          ))}
        </div>

        {/* Count */}
        <div style={{ fontSize:"12px", color:"var(--text3)", marginBottom:"12px", letterSpacing:"0.3px" }}>
          找到 <strong style={{ color:"var(--green)" }}>{results.length}</strong> 項結果
        </div>

        {/* Cards */}
        {results.length === 0 ? (
          <div style={{ textAlign:"center", padding:"48px 16px", color:"var(--text3)", fontSize:"15px" }}>
            找不到符合的疫苗，請嘗試其他關鍵字
          </div>
        ) : (
          <div style={{ display:"flex", flexDirection:"column", gap:"10px" }}>
            {results.map(v => {
              const open = selected?.id === v.id;
              return (
                <div key={v.id} onClick={() => setSelected(open ? null : v)} style={{
                  borderRadius:"14px",
                  border: open ? "1.5px solid var(--green)" : "1.5px solid var(--border)",
                  background: open ? "var(--green-lt)" : "var(--surface)",
                  padding:"14px 16px", cursor:"pointer",
                  boxShadow: open
                    ? "0 2px 12px rgba(90,138,106,0.15)"
                    : "0 1px 3px rgba(0,0,0,0.05)",
                  transition:"all 0.18s",
                }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:"8px" }}>
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:"15px", fontWeight:"700", color:"var(--text)", marginBottom:"3px", lineHeight:"1.4" }}>
                        {hl(v.chinese, query)}
                        {v.note && (
                          <span style={{ marginLeft:"8px", fontSize:"11px", padding:"2px 8px", borderRadius:"10px", background:"var(--green)", color:"#fff", verticalAlign:"middle" }}>{v.note}</span>
                        )}
                        <TypeBadge code={v.code} />
                      </div>
                      <div style={{ fontSize:"13px", color:"var(--text3)" }}>{hl(v.brand, query)}</div>
                    </div>
                    <div style={{ textAlign:"right", flexShrink:0 }}>
                      <div style={{ fontSize:"20px", fontWeight:"800", color:"var(--amber)", letterSpacing:"-0.5px" }}>
                        ${v.price.toLocaleString()}
                      </div>
                      <div style={{ fontSize:"11px", color:"var(--text3)" }}>職員 ${v.staffPrice.toLocaleString()}</div>
                    </div>
                  </div>

                  {open && (
                    <div style={{ marginTop:"14px", paddingTop:"14px", borderTop:"1.5px dashed var(--green-md)" }}>
                      <table style={{ width:"100%", borderCollapse:"collapse", fontSize:"13px" }}>
                        <tbody>
                          {[
                            ["學名",   v.generic],
                            ["藥品碼", v.code],
                            ["商品名", v.brand],
                            ["中文名", v.chinese],
                            ["一般自費", `NT$ ${v.price.toLocaleString()}`],
                            ["職員優惠", `NT$ ${v.staffPrice.toLocaleString()}`],
                            ["許可證", PERMIT_BY_CODE[v.code] || "待補"],
                          ].map(([label,val]) => (
                            <tr key={label}>
                              <td style={{ padding:"5px 0", color:"var(--text3)", width:"76px", verticalAlign:"top", fontWeight:"500" }}>{label}</td>
                              <td style={{ padding:"5px 0", color:"var(--text)" }}>{val}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                      <div style={{ marginTop:"10px", display:"flex", flexWrap:"wrap", gap:"6px" }}>
                        {v.tags.map(t => (
                          <span key={t} style={{ fontSize:"11px", padding:"3px 9px", borderRadius:"10px", background:"var(--bg2)", color:"var(--text2)", border:"1px solid var(--border)" }}>{t}</span>
                        ))}
                      </div>
                      {infoOf(v.code) && (
                        <button onClick={e => { e.stopPropagation(); setInfoFor(v); }} style={{
                          marginTop:"12px", width:"100%", padding:"10px 14px", borderRadius:"10px",
                          border:"1.5px solid var(--green)", background:"var(--surface)", color:"var(--green)",
                          fontSize:"14px", fontWeight:"700", cursor:"pointer",
                        }}>📖 接種建議與注意事項</button>
                      )}
                      <a href={leafletUrl(v.code) || FDA_HOME} target="_blank" rel="noopener noreferrer" onClick={e => e.stopPropagation()} style={{
                        display:"block", marginTop:"8px", padding:"9px 14px", borderRadius:"10px", textAlign:"center",
                        border:"1.5px solid var(--border2)", background:"var(--surface)", color:"var(--text2)",
                        fontSize:"13px", fontWeight:"600", textDecoration:"none",
                      }}>{leafletUrl(v.code) ? "📄 開啟仿單（食藥署）↗" : "📄 仿單查詢平台 ↗（許可證字號待補，需自行查詢）"}</a>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        <div style={{ marginTop:"28px", padding:"12px 16px", borderRadius:"10px", background:"var(--amber-lt)", border:"1px solid #e8c98a", fontSize:"12px", color:"var(--text2)", lineHeight:"1.6" }}>
          ⚠️ 以上價格僅含疫苗藥品費用，不含掛號費、注射技術費、處置費等其他相關費用。
        </div>
        {infoFor && <InfoModal v={infoFor} onClose={() => setInfoFor(null)} />}
      </div>
    );
  }

  /* ── Table Tab ── */
  function TableTab() {
    const cols = ["學名","藥品碼","商品名","中文名","一般價(NT$)","職員價(NT$)"];
    return (
      <div style={{ padding:"20px 16px" }}>
        <div style={{ fontSize:"11px", color:"var(--green)", letterSpacing:"2px", marginBottom:"14px", textTransform:"uppercase", fontWeight:"600" }}>
          自費疫苗費用一覽表 · 2026.10.05 更新 · 共 {vaccines.length} 項
        </div>
        <div style={{ overflowX:"auto", borderRadius:"14px", border:"1.5px solid var(--border)", boxShadow:"0 2px 8px rgba(0,0,0,0.06)" }}>
          <table style={{ width:"100%", borderCollapse:"collapse", fontSize:"12.5px", minWidth:"720px" }}>
            <thead>
              <tr style={{ background:"var(--green)", borderBottom:"2px solid var(--green)" }}>
                {cols.map(c => (
                  <th key={c} style={{
                    padding:"12px 10px",
                    textAlign: c.includes("價") ? "right" : "left",
                    color:"#fff", fontWeight:"600",
                    letterSpacing:"0.5px", whiteSpace:"nowrap",
                  }}>{c}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {vaccines.map((v,i) => (
                <tr key={v.id} style={{
                  borderBottom:"1px solid var(--border)",
                  background: i%2===0 ? "var(--surface)" : "var(--surface2)",
                  transition:"background 0.15s",
                }}
                  onMouseEnter={e => e.currentTarget.style.background="var(--green-lt)"}
                  onMouseLeave={e => e.currentTarget.style.background = i%2===0 ? "var(--surface)" : "var(--surface2)"}
                >
                  <td style={{ padding:"10px", color:"var(--text3)", fontSize:"11px", lineHeight:"1.5", maxWidth:"180px" }}>{v.generic}</td>
                  <td style={{ padding:"10px", color:"var(--green)", fontFamily:"monospace", whiteSpace:"nowrap", fontWeight:"600" }}>{v.code}</td>

                  <td style={{ padding:"10px", color:"var(--text)", lineHeight:"1.5" }}>{v.chinese}</td>

          ⚠️ 價格僅含疫苗藥品費用，不含掛號費、注射技術費、處置費等其他相關費用。
        </div>
      </div>
    );
  }

  /* ── 公費肺炎鏈球菌 Tab ── */
  // 年次↔年齡換算一律用「今天的民國年」：院內表與疾管署皆以「當年年次」計算，
  // 每年1月1日自動換算，不需改程式。（規則本身若修訂，仍需手動更新下方條件與表格文字）
  const rocYear = () => new Date().getFullYear() - 1911;

  const PNEU_IDS = [
    { id: "indigenous",  label: "原住民" },
    { id: "dialysis",    label: "洗腎患者" },
    { id: "institution", label: "機構住民" },
    { id: "ipd",         label: "IPD高風險對象" },
  ];
  const PNEU_HIST = [
    { id: "never",   label: "從未接種過" },
    { id: "ppv23",   label: "僅曾接種過23價" },
    { id: "pcv1315", label: "僅曾接種過13/15價" },
    { id: "both",    label: "已完成13/15價+23價" },
    { id: "pcv2021", label: "曾接種過20/21價" },
  ];
  const IPD_DEF = "脾臟功能缺損、先天或後天免疫功能不全、人工耳植入、腦脊髓液滲漏，以及一年內接受癌症藥物治療(含注射式或口服化療藥、生物製劑、標靶藥物、免疫療法等)或放射治療之惡性腫瘤者；另器官移植者不受「一年內」限制";
  const INST_DEF = "入住一般護理之家、精神護理之家、精神復健機構、老人福利機構、身心障礙福利機構、住宿式長照機構、榮譽國民之家等機構者。";

  /* --- 日期工具 --- */
  function parseLocalDate(s) {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  function addInterval(d, iv) {
    const r = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    if (iv.years) r.setFullYear(r.getFullYear() + iv.years);
    if (iv.weeks) r.setDate(r.getDate() + iv.weeks * 7);
    return r;
  }
  function fmtDate(d) {
    const p = n => String(n).padStart(2, "0");
    return `民國${d.getFullYear() - 1911}年${d.getMonth() + 1}月${d.getDate()}日（${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())}）`;
  }
  function dayDiff(a, b) { return Math.round((a - b) / 86400000); }
  function statusFor(last, iv, today) {
    const earliest = addInterval(last, iv);
    const diff = dayDiff(earliest, today);
    return diff <= 0
      ? { tone: "ok",   text: `已達間隔，現在可接種（最早可接種日：${fmtDate(earliest)}）` }
      : { tone: "wait", text: `尚未達間隔，最早可接種日：${fmtDate(earliest)}（還有 ${diff} 天）` };
  }

  /* --- 判斷邏輯（依院內參考表；kind A＝長者/原住民列，kind B＝洗腎・機構住民/IPD列）--- */
  function buildAdvice(kind, c) {
    const none = { tone: "none", headline: "無須再接種", notes: [] };
    const hint = "填入最後一劑接種日期，可計算最早可接種日。";
    const withIv = (iv, label) => {
      const headline = `與前劑間隔 ≥ ${label}後，可接種 20/21價`;
      if (!c.last) return { tone: "info", headline, notes: [hint] };
      const s = statusFor(c.last, iv, c.today);
      return { tone: s.tone, headline, notes: [s.text] };
    };
    switch (c.hist) {
      case "never":   return { tone: "ok", headline: "可接種 20/21價", notes: ["無須間隔"] };
      case "ppv23":   return withIv({ years: 1 }, "1年");
      case "pcv1315": return kind === "B" ? withIv({ weeks: 8 }, "8週") : withIv({ years: 1 }, "1年");
      case "pcv2021": return none;
      case "both": {
        if (!(kind === "B" && c.ipdInB)) return none;
        const add = "再追加接種 1劑 20/21價";
        if (c.ag < 65) {
          return {
            tone: "wait",
            headline: `目前暫無須再接種；滿65歲(含)且與前劑間隔滿5年後，可${add}`,
            notes: [
              `年齡條件：滿65歲(含)。以年次計為民國${c.by + 65}年起，請核對實際足歲。`,
              c.last
                ? `間隔條件：與前劑間隔滿5年，最早日期 ${fmtDate(addInterval(c.last, { years: 5 }))}。`
                : "間隔條件：與前劑間隔滿5年。填入最後一劑接種日期，可計算最早日期。",
              "兩項條件皆符合後，才可追加。",
            ],
          };
        }
        if (c.before65 === "yes") {
          const headline = `與前劑間隔滿5年後，可${add}`;
          if (!c.last) return { tone: "info", headline, notes: [hint] };
          const s = statusFor(c.last, { years: 5 }, c.today);
          return { tone: s.tone, headline, notes: [s.text] };
        }
        if (c.before65 === "no") return none;
        return {
          tone: "ask",
          headline: "需先確認：13/15價+23價是否於65歲前完成？",
          notes: ["選「是」：與前劑間隔滿5年後，可再追加接種 1劑 20/21價", "選「否」：無須再接種"],
        };
      }
      default: return none;
    }
  }

  function computePneu(inp) {
    const { ag, by, ids, hist, before65, lastDate, today } = inp;
    const has = id => ids.includes(id);
    const is65 = ag >= 65;
    const ipdInB = has("ipd") && ag >= 19;
    const last = lastDate ? parseLocalDate(lastDate) : null;
    const ctx = { hist, ag, by, last, today, ipdInB, before65 };
    const cards = [];
    const notices = [];

    const whoA = [];
    if (is65) whoA.push("65歲以上長者");
    else if (has("indigenous") && ag >= 55) whoA.push("55–64歲原住民");
    if (whoA.length) cards.push({ kind: "A", who: whoA, adv: buildAdvice("A", ctx) });

    const whoB = [];
    if (has("dialysis") && is65) whoB.push("65歲以上洗腎患者");
    if (has("institution") && is65) whoB.push("65歲以上機構住民");
    if (ipdInB) whoB.push("IPD高風險對象");
    if (whoB.length) cards.push({ kind: "B", who: whoB, adv: buildAdvice("B", ctx) });

    if (has("indigenous") && ag < 55) notices.push("原住民：表列對象為55–64歲（51–60年次），目前年齡未達，此身分不適用。");
    if (has("dialysis") && !is65) notices.push("洗腎患者：表列對象為65歲以上，未滿65歲此身分不適用。");
    if (has("institution") && !is65) notices.push("機構住民：表列對象為65歲以上，未滿65歲此身分不適用。");
    if (has("ipd") && ag < 19) notices.push("IPD高風險對象：表列對象為19歲以上，未滿19歲不適用。");

    const sig = c => `${c.adv.tone}|${c.adv.headline}|${c.adv.notes.join("/")}`;
    const conflict = cards.length === 2 && !cards.some(c => c.adv.tone === "ask") && sig(cards[0]) !== sig(cards[1]);
    const lastFuture = !!last && last > today;
    return { cards, notices, conflict, lastFuture };
  }

  /* --- 結果顯示 --- */
  const TONE = {
    ok:   { bar: "var(--green)",   bg: "var(--green-lt)", icon: "✅" },
    info: { bar: "var(--green)",   bg: "var(--green-lt)", icon: "ℹ️" },

                  <ul style={{ margin: "8px 0 0", paddingLeft: "18px", fontSize: "13px", color: "var(--text2)", lineHeight: "1.7" }}>
                    {c.adv.notes.map((n, i) => <li key={i}>{n}</li>)}
                  </ul>
                )}
                {c.kind === "B" && c.adv.tone !== "none" && (

                    📝 登錄接種資料時，請加註身分別代碼「R02A」（疾管署）。

        {r.notices.length > 0 && (

        {showInfo && (
          <div style={{ marginTop: "12px", padding: "12px 16px", borderRadius: "12px", background: "var(--surface)", border: "1px solid var(--border)", fontSize: "13px", lineHeight: "1.8", color: "var(--text2)" }}>

            <div>● 時間：週一至週六 08:15–11:30　地點：地下1樓健檢中心</div>

        </div>

  }

    border: on ? "1.5px solid var(--green)" : "1.5px solid var(--border)",
    background: on ? "var(--green-lt)" : "var(--surface)",
    color: "var(--text)", fontWeight: on ? "700" : "400",
  });
  function todayInfo() {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const p2 = n => String(n).padStart(2, "0");
    return { today, todayISO: `${today.getFullYear()}-${p2(today.getMonth() + 1)}-${p2(today.getDate())}` };
  }

  function AgeInputs({ birthYear, age, onBirthYear, onAge, typed, valid }) {
    const cur = rocYear();
    return (
      <>
        <span style={labelStyle}>① 民國年次 或 年齡（填一項即可，會自動換算）</span>
        <div style={{ display: "flex", gap: "10px", alignItems: "center" }}>
          <div style={{ flex: 1 }}>
            <input type="text" inputMode="numeric" placeholder="年次，如 50" value={birthYear} onChange={e => onBirthYear(e.target.value)} style={fieldStyle} />
          </div>
          <div style={{ color: "var(--text3)" }}>↔</div>
          <div style={{ flex: 1 }}>
            <input type="text" inputMode="numeric" placeholder="年齡，如 65" value={age} onChange={e => onAge(e.target.value)} style={fieldStyle} />
          </div>
        </div>
        <div style={{ fontSize: "11px", color: "var(--text3)", marginTop: "6px", lineHeight: "1.6" }}>
          年齡 ＝ 當年（民國{cur}年）− 年次（以年次計算，不看生日；與實際足歲可能差 1 歲）
        </div>
        {typed && !valid && (
          <div style={{ fontSize: "12px", color: "#c0392b", marginTop: "6px" }}>請確認輸入：年齡須介於 0–110（年次 {cur - 110}–{cur}）。</div>
        )}
      </>
    );
  }

  /* ════════ 公費模式 ════════ */
  function PublicTool({ active, ageNode, ag, by, valid, onResetAge }) {
    const [ids, setIds] = useState([]);
    const [hist, setHist] = useState("");
    const [before65, setBefore65] = useState("");
    const [lastDate, setLastDate] = useState("");
    const toggleId = id => setIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
    const reset = () => { onResetAge(); setIds([]); setHist(""); setBefore65(""); setLastDate(""); };

    const { today, todayISO } = todayInfo();
    const ipdInB = valid && ids.includes("ipd") && ag >= 19;
    const needsDate = hist === "ppv23" || hist === "pcv1315" || hist === "both";
    const needsBefore65 = hist === "both" && ipdInB && ag >= 65;
    const result = valid && hist
      ? computePneu({ ag, by, ids, hist, before65: needsBefore65 ? before65 : "", lastDate: needsDate ? lastDate : "", today })
      : null;

    return (
      <div style={{ display: active ? "block" : "none" }}>
        <div style={{ maxWidth: "680px", margin: "0 auto" }}>
          <div style={cardBox}>
            <div style={{ fontSize: "15px", fontWeight: "700", marginBottom: "14px" }}>資格與建議小工具（公費）</div>
            {ageNode}

            <div style={gapStyle}>
              <span style={labelStyle}>② 身分（可複選）</span>
              <div style={{ display: "flex", flexWrap: "wrap", gap: "8px" }}>
                {PNEU_IDS.map(i => {
                  const on = ids.includes(i.id);
                  return <button key={i.id} onClick={() => toggleId(i.id)} style={chipStyle(on)}>{on ? "✓ " : ""}{i.label}</button>;
                })}
              </div>
              <details style={{ marginTop: "8px", fontSize: "12px", color: "var(--text2)", lineHeight: "1.7" }}>
                <summary style={{ cursor: "pointer", color: "var(--text3)" }}>查看「IPD高風險對象」「機構住民」定義</summary>
                <div style={{ marginTop: "4px" }}>
                  <div>【IPD高風險對象・院內表】{IPD_DEF}</div>
                  <div style={{ marginTop: "4px" }}>【機構住民・疾管署】{INST_DEF}</div>
                </div>
              </details>
              <div style={{ fontSize: "11px", color: "var(--text3)", marginTop: "6px" }}>65歲以上長者依年次自動判定，不需勾選。</div>
            </div>

            <div style={gapStyle}>
              <span style={labelStyle}>③ 過往接種史</span>
              <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                {PNEU_HIST.map(h => (
                  <button key={h.id} onClick={() => setHist(h.id)} style={optStyle(hist === h.id)}>{hist === h.id ? "● " : "○ "}{h.label}</button>
                ))}
              </div>
            </div>

            {needsBefore65 && (
              <div style={gapStyle}>
                <span style={labelStyle}>③-1 13/15價+23價是否於「65歲前」完成？</span>
                <div style={{ display: "flex", gap: "8px" }}>
                  <button onClick={() => setBefore65("yes")} style={{ ...chipStyle(before65 === "yes"), flex: 1 }}>是，65歲前完成</button>
                  <button onClick={() => setBefore65("no")} style={{ ...chipStyle(before65 === "no"), flex: 1 }}>否，65歲(含)後完成</button>
                </div>
              </div>
            )}

            {needsDate && (
              <div style={gapStyle}>
                <span style={labelStyle}>④ 最後一劑接種日期（選填）</span>
                <input type="date" value={lastDate} max={todayISO} onChange={e => setLastDate(e.target.value)} style={fieldStyle} />
                <div style={{ fontSize: "11px", color: "var(--text3)", marginTop: "6px" }}>填入後會計算最早可接種日；間隔從最後一劑（前劑）算起。</div>
              </div>
            )}

            <div style={{ marginTop: "16px", textAlign: "right" }}>
              <button onClick={reset} style={{ padding: "6px 14px", borderRadius: "16px", border: "1.5px solid var(--border)", background: "var(--surface)", color: "var(--text3)", fontSize: "12px", cursor: "pointer" }}>清除重填</button>
            </div>
          </div>

          {result ? (
            <PneuResults r={result} ids={ids} ag={ag} by={by} />
          ) : (
            <div style={{ marginTop: "18px", padding: "14px 16px", borderRadius: "12px", border: "1.5px dashed var(--border2)", fontSize: "13px", color: "var(--text3)", textAlign: "center" }}>
              請輸入年次或年齡，並選擇過往接種史，即顯示建議。
            </div>
          )}
        </div>

        <div style={{ marginTop: "28px" }}>
          <div style={{ fontSize: "11px", color: "var(--green)", letterSpacing: "2px", marginBottom: "12px", fontWeight: "600" }}>
            公費肺炎鏈球菌疫苗 · 院內施打建議與流程（完整表格）
          </div>
          <PneuTable />
          <PneuNotes />
        </div>
      </div>
    );
  }

  /* ════════ 自費模式 ════════ */
  // 自費建議中的疫苗種類 → 院內自費價目表藥品碼（null＝院內無品項）。價目表新增品項後，在此填入藥品碼即可。
  const SELF_PRODUCT = { PCV13: "MIPVEH", PCV15: null, PCV20: "MIPVEM", PCV21: null, PPV23: "MIPNE" };

  const SELF_HIST = [
    { id: "never",    label: "從未接種過" },
    { id: "ppv23",    label: "僅接種過PPV23" },
    { id: "pcv1315",  label: "僅接種過PCV13/15" },
    { id: "complete", label: "PCV13/15+PPV23 或 PCV20 或 PCV21" },
  ];
  // 疾管署「高危險群」定義，逐項照原文
  const SELF_RISK_A = [
    { id: "r1", label: "（1）脾臟功能缺損或脾臟切除" },
    { id: "r2", label: "（2）先天或後天免疫功能不全（含括愛滋病毒感染者）" },
    { id: "r3", label: "（3）人工耳植入者" },
  ];
  const SELF_RISK_4 = [
    { id: "r4a", label: "慢性腎病變" },
    { id: "r4b", label: "慢性心臟疾病" },
    { id: "r4c", label: "慢性肺臟病" },
    { id: "r4d", label: "糖尿病" },
    { id: "r4e", label: "慢性肝病與肝硬化患者" },
    { id: "r4f", label: "酒癮者" },
    { id: "r4g", label: "菸癮者" },
  ];
  const SELF_RISK_B = [
    { id: "r5", label: "（5）腦脊髓液滲漏者" },
    { id: "r6", label: "（6）接受免疫抑制劑或放射治療的惡性腫瘤者或器官移植者" },
  ];
  const SELF_DEF_TEXT = "不論年齡均亦列為高危險群的包括：（1）脾臟功能缺損或脾臟切除、（2）先天或後天免疫功能不全（含括愛滋病毒感染者）、（3）人工耳植入者、（4）慢性疾病：慢性腎病變、慢性心臟疾病、慢性肺臟病、糖尿病、慢性肝病與肝硬化患者、酒癮者、菸癮者等、（5）腦脊髓液滲漏者、（6）接受免疫抑制劑或放射治療的惡性腫瘤者或器官移植者。";

  // 「青少年」下限：疾管署慣例為 11–18 歲（由使用者提供；該自費建議表原文未載，請自行核對）
  const SELF_MIN_AGE = 11;
  function selfScope(ag, risks) {
    if (ag >= 65) return "over";
    if (ag < SELF_MIN_AGE) return "under";
    if (risks.length === 0) return "norisk";
    return "ok";
  }

  function computeSelf({ hist, lastDate, today }) {
    const last = lastDate ? parseLocalDate(lastDate) : null;
    const R = {
      never:    { headline: "PCV20 或 PCV21", names: ["PCV20", "PCV21"], iv: null },
      ppv23:    { headline: "間隔滿1年，可接種 PCV13 或 PCV15 或 PCV20 或 PCV21", names: ["PCV13", "PCV15", "PCV20", "PCV21"], iv: { years: 1 } },
      pcv1315:  { headline: "間隔滿8週，可接種 PCV20 或 PCV21 或 PPV23", names: ["PCV20", "PCV21", "PPV23"], iv: { weeks: 8 } },
      complete: { headline: "已完整接種肺炎鏈球菌疫苗，無需再接種 PCV20 或 PCV21", names: [], iv: null },
    }[hist];
    let status = null;
    if (R.iv) status = last ? statusFor(last, R.iv, today) : { tone: "info", text: "填入最後一劑接種日期，可計算最早可接種日。" };
    const tone = status ? status.tone : (hist === "complete" ? "none" : "ok");
    return { headline: R.headline, names: R.names, status, tone, lastFuture: !!last && last > today };
  }

  function ProductLines({ names }) {
    if (!names.length) return null;
    return (
      <div style={{ marginTop: "10px", borderTop: "1px dashed var(--green-md)", paddingTop: "8px" }}>
        <div style={{ fontSize: "11px", color: "var(--text3)", marginBottom: "4px" }}>院內自費品項與價格（取自自費價目表）</div>
        {names.map(n => {
          const code = SELF_PRODUCT[n];
          const item = code ? vaccines.find(v => v.code === code) : null;
          return (
            <div key={n} style={{ display: "flex", justifyContent: "space-between", gap: "10px", fontSize: "13px", padding: "3px 0", lineHeight: "1.5" }}>
              <span style={{ flex: 1 }}><strong>{n}</strong>{item ? `　${item.brand}` : ""}</span>
              <span style={{ flexShrink: 0, textAlign: "right", color: item ? "var(--amber)" : "var(--text3)", fontWeight: item ? "700" : "400" }}>
                {item ? `$${item.price.toLocaleString()}（職員 $${item.staffPrice.toLocaleString()}）` : "院內無品項"}
              </span>
            </div>
          );
        })}
        <div style={{ fontSize: "11px", color: "var(--text3)", marginTop: "4px" }}>價格僅含疫苗藥品費用，不含掛號費、注射技術費、處置費等其他相關費用。</div>
      </div>
    );
  }

  function SelfResults({ scope, r, ag, by }) {
    const msgs = {
      over:   "不在此建議表範圍：表列為「青少年及19–64歲」高危險群。65歲以上長者為公費對象，可切換上方「公費」模式查詢。",
      under:  "不在此建議表範圍：表列為「青少年及19–64歲」，青少年依疾管署慣例以11–18歲計，未滿11歲不適用。",
      norisk: "未勾選任何高危險群項目，不在此建議表範圍。",
    };
    const head = (
      <div style={{ fontSize: "13px", fontWeight: "700", color: "var(--green)", marginBottom: "10px", letterSpacing: "0.5px" }}>
        建議結果
        <span style={{ fontWeight: "400", color: "var(--text3)", marginLeft: "8px", fontSize: "12px" }}>
          {by} 年次 ↔ {ag} 歲（以年次計算，與實際足歲可能差 1 歲）
        </span>
      </div>
    );
    if (scope !== "ok") {
      return (
        <div style={{ marginTop: "18px" }}>
          {head}
          <div style={{ padding: "14px 16px", borderRadius: "12px", border: "1.5px solid var(--border2)", background: "var(--surface2)", fontSize: "14px", lineHeight: "1.7" }}>
            {msgs[scope]}
          </div>
        </div>
      );
    }
    const t = TONE[r.tone];
    return (
      <div style={{ marginTop: "18px" }}>
        {head}
        {r.lastFuture && <div style={{ ...warnBox, marginBottom: "10px" }}>⚠️ 所填接種日期晚於今天，請確認。</div>}
        <div style={{ borderRadius: "14px", border: `1.5px solid ${t.bar}`, background: t.bg, padding: "14px 16px" }}>
          <div style={{ fontSize: "11px", color: "var(--text3)", marginBottom: "3px" }}>依疾管署自費接種建議（青少年及19–64歲高危險群）</div>
          <div style={{ fontSize: "16px", fontWeight: "700", lineHeight: "1.5" }}>{t.icon} {r.headline}</div>
          {r.status && (
            <ul style={{ margin: "8px 0 0", paddingLeft: "18px", fontSize: "13px", color: "var(--text2)", lineHeight: "1.7" }}>
              <li>{r.status.text}</li>
            </ul>
          )}
          <ProductLines names={r.names} />
        </div>
        {ag <= 18 && (
          <div style={{ ...warnBox, marginTop: "10px", fontSize: "12px" }}>
            ⚠️ 青少年以11–18歲計：此為疾管署慣用範圍，該自費建議表原文未載，請自行核對。
          </div>
        )}
        {ag >= 19 && (
          <div style={{ marginTop: "10px", padding: "10px 14px", borderRadius: "10px", background: "var(--surface)", border: "1px solid var(--border)", fontSize: "12px", color: "var(--text2)", lineHeight: "1.6" }}>
            19–64歲若同時屬公費「IPD高風險對象」，另有公費資格，可切換上方「公費」模式查詢。
          </div>
        )}
        <div style={{ marginTop: "10px", ...warnBox, fontSize: "12px" }}>
          ⚠️ 本工具僅供醫療人員參考，<strong>實際接種以醫師評估為準</strong>。
        </div>
      </div>
    );
  }

  function SelfTable() {
    const td = { padding: "10px 12px", border: "1px solid var(--border)", fontSize: "13px", lineHeight: "1.7", verticalAlign: "middle", background: "var(--surface)", color: "var(--text)" };
    const th = { padding: "11px 12px", border: "1px solid var(--green)", background: "var(--green)", color: "#fff", fontWeight: "600", textAlign: "left" };
    const rows = [
      ["從未接種過", "PCV20或PCV21"],
      ["僅接種過PPV23", "間隔滿1年，可接種PCV13或PCV15或PCV20或PCV21"],
      ["僅接種過PCV13/15", "間隔滿8週，可接種PCV20或PCV21或PPV23"],
      ["PCV13/15+PPV23或PCV20或PCV21", "已完整接種肺炎鏈球菌疫苗，無需再接種PCV20或PCV21"],
    ];
    return (
      <div style={{ overflowX: "auto", borderRadius: "14px", border: "1.5px solid var(--border)", boxShadow: "0 2px 8px rgba(0,0,0,0.06)" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", minWidth: "480px" }}>
          <thead><tr><th style={th}>過往接種史</th><th style={th}>接續接種建議</th></tr></thead>
          <tbody>{rows.map(r => <tr key={r[0]}><td style={td}>{r[0]}</td><td style={td}>{r[1]}</td></tr>)}</tbody>
        </table>
      </div>
    );
  }

  function SelfNotes() {
    return (
      <>
        <div style={{ marginTop: "16px", padding: "14px 16px", borderRadius: "12px", background: "var(--surface)", border: "1px solid var(--border)", fontSize: "12.5px", lineHeight: "1.8", color: "var(--text2)" }}>
          <div style={{ fontWeight: "700", color: "var(--green)", marginBottom: "4px" }}>疾管署：高危險群定義</div>
          <div>{SELF_DEF_TEXT}</div>
        </div>
        <div style={{ marginTop: "12px", padding: "14px 16px", borderRadius: "12px", background: "var(--surface)", border: "1px solid var(--border)", fontSize: "12.5px", lineHeight: "1.8", color: "var(--text2)" }}>
          <div style={{ fontWeight: "700", color: "var(--green)", marginBottom: "4px" }}>院內自費品項對照</div>
          <ProductLines names={["PCV13", "PCV15", "PCV20", "PCV21", "PPV23"]} />
        </div>
      </>
    );
  }

  function SelfPayTool({ active, ageNode, ag, by, valid, onResetAge }) {
    const [risks, setRisks] = useState([]);
    const [hist, setHist] = useState("");
    const [lastDate, setLastDate] = useState("");
    const toggleRisk = id => setRisks(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
    const reset = () => { onResetAge(); setRisks([]); setHist(""); setLastDate(""); };

    const { today, todayISO } = todayInfo();
    const scope = valid ? selfScope(ag, risks) : null;
    const needsDate = hist === "ppv23" || hist === "pcv1315";
    const result = scope === "ok" && hist ? computeSelf({ hist, lastDate: needsDate ? lastDate : "", today }) : null;
    const riskChip = r => {
      const on = risks.includes(r.id);
      return <button key={r.id} onClick={() => toggleRisk(r.id)} style={chipStyle(on, "12px")}>{on ? "✓ " : ""}{r.label}</button>;
    };

    return (
      <div style={{ display: active ? "block" : "none" }}>
        <div style={{ maxWidth: "680px", margin: "0 auto" }}>
          <div style={cardBox}>
            <div style={{ fontSize: "15px", fontWeight: "700", marginBottom: "14px" }}>接種建議小工具（自費）</div>
            {ageNode}

            <div style={gapStyle}>
              <span style={labelStyle}>② 高危險群（可複選，符合任一項即可）</span>
              <div style={{ display: "flex", flexWrap: "wrap", gap: "8px" }}>{SELF_RISK_A.map(riskChip)}</div>
              <div style={{ fontSize: "12px", color: "var(--text2)", margin: "10px 0 6px" }}>
                （4）慢性疾病
                <span style={{ color: "var(--text3)" }}>　原文結尾為「等」，未列者請由醫師判斷</span>
              </div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: "8px" }}>{SELF_RISK_4.map(riskChip)}</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: "8px", marginTop: "10px" }}>{SELF_RISK_B.map(riskChip)}</div>
            </div>

            <div style={gapStyle}>
              <span style={labelStyle}>③ 過往接種史</span>
              <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                {SELF_HIST.map(h => (
                  <button key={h.id} onClick={() => setHist(h.id)} style={optStyle(hist === h.id)}>{hist === h.id ? "● " : "○ "}{h.label}</button>
                ))}
              </div>
            </div>

            {needsDate && (
              <div style={gapStyle}>
                <span style={labelStyle}>④ 最後一劑接種日期（選填）</span>
                <input type="date" value={lastDate} max={todayISO} onChange={e => setLastDate(e.target.value)} style={fieldStyle} />
                <div style={{ fontSize: "11px", color: "var(--text3)", marginTop: "6px" }}>填入後會計算最早可接種日；間隔從最後一劑（前劑）算起。</div>
              </div>
            )}

            <div style={{ marginTop: "16px", textAlign: "right" }}>
              <button onClick={reset} style={{ padding: "6px 14px", borderRadius: "16px", border: "1.5px solid var(--border)", background: "var(--surface)", color: "var(--text3)", fontSize: "12px", cursor: "pointer" }}>清除重填</button>
            </div>
          </div>

          {scope && scope !== "ok" ? (
            <SelfResults scope={scope} r={null} ag={ag} by={by} />
          ) : result ? (
            <SelfResults scope="ok" r={result} ag={ag} by={by} />
          ) : (
            <div style={{ marginTop: "18px", padding: "14px 16px", borderRadius: "12px", border: "1.5px dashed var(--border2)", fontSize: "13px", color: "var(--text3)", textAlign: "center" }}>
              請輸入年次或年齡、勾選高危險群，並選擇過往接種史，即顯示建議。
            </div>
          )}
        </div>

        <div style={{ marginTop: "28px" }}>
          <div style={{ fontSize: "11px", color: "var(--green)", letterSpacing: "2px", marginBottom: "12px", fontWeight: "600" }}>
            ◎ 青少年及19–64歲高危險群之自費接種建議（疾管署）
          </div>
          <SelfTable />
          <SelfNotes />
        </div>
      </div>
    );
  }

  /* --- 分頁本體（公費／自費切換；年次／年齡共用）--- */
  function PneuTab() {
    const [mode, setMode] = useState("public");
    const [birthYear, setBirthYear] = useState("");
    const [age, setAge] = useState("");

    const digits = v => v.replace(/\D/g, "").slice(0, 3);
    const onBirthYear = v => {
      const s = digits(v);
      setBirthYear(s);
      setAge(s === "" ? "" : String(rocYear() - parseInt(s, 10)));
    };
    const onAge = v => {
      const s = digits(v);
      setAge(s);
      setBirthYear(s === "" ? "" : String(rocYear() - parseInt(s, 10)));
    };
    const onResetAge = () => { setBirthYear(""); setAge(""); };

    const ag = age === "" ? NaN : parseInt(age, 10);
    const valid = Number.isInteger(ag) && ag >= 0 && ag <= 110;
    const by = valid ? rocYear() - ag : NaN;
    const typed = birthYear !== "" || age !== "";
    const ageNode = <AgeInputs birthYear={birthYear} age={age} onBirthYear={onBirthYear} onAge={onAge} typed={typed} valid={valid} />;

    const modes = [
      { id: "public", label: "公費（院內表）" },
      { id: "self",   label: "自費（疾管署建議）" },
    ];
    return (
      <div style={{ padding: "20px 16px" }}>
        <div style={{ maxWidth: "680px", margin: "0 auto" }}>
          <div style={{ display: "flex", gap: "0", marginBottom: "14px", borderRadius: "12px", border: "1.5px solid var(--green)", overflow: "hidden" }}>
            {modes.map(m => (
              <button key={m.id} onClick={() => setMode(m.id)} style={{
                flex: 1, padding: "10px 4px", border: "none", cursor: "pointer", fontSize: "14px",
                background: mode === m.id ? "var(--green)" : "var(--surface)",
                color: mode === m.id ? "#fff" : "var(--green)",
                fontWeight: mode === m.id ? "700" : "500",
              }}>{m.label}</button>
            ))}
          </div>
          <div style={{ fontSize: "12px", color: "var(--text3)", marginBottom: "14px", lineHeight: "1.6" }}>
            {mode === "public"
              ? "資料來源：院內參考表＋疾管署《成人公費肺炎鏈球菌疫苗接種計畫》（自115年8月10日起適用）。供醫療人員參考，規則修訂時以疾管署最新公告為準。"
              : "資料來源：疾病管制署網站「自費肺炎鏈球菌疫苗接種建議」（青少年及19–64歲高危險群；網站最後更新 2026/8/7）；院內品項與價格取自自費價目表。供醫療人員參考，規則修訂時以疾管署最新公告為準。"}
          </div>
        </div>
        <PublicTool active={mode === "public"} ageNode={ageNode} ag={ag} by={by} valid={valid} onResetAge={onResetAge} />
        <SelfPayTool active={mode === "self"} ageNode={ageNode} ag={ag} by={by} valid={valid} onResetAge={onResetAge} />
      </div>
    );
  }

  /* ── Root App ── */
  function App() {
    const [tab, setTab] = useState("search");
    return (
      <div style={{ minHeight:"100vh" }}>
        <Header tab={tab} />
        <TabBar active={tab} onChange={setTab} />
        {tab==="search" ? <SearchTab /> : tab==="table" ? <TableTab /> : <PneuTab />}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
